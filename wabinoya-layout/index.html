<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>わびのや配置スタジオ</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Shippori+Mincho:wght@600;700&family=Zen+Kaku+Gothic+New:wght@400;500;700&display=swap">
<style>
:root{
  --bg:#F5F1E9; --panel:#FDFBF7; --panel2:#EFEAE0; --ink:#2B251D; --muted:#8B8172;
  --line:#DED6C7; --accent:#BC5A2A; --accent-soft:#F3E0D3; --accent-ink:#FFFFFF;
  --canvas:#EFEAE0; --grid:#E0D9CB; --grid2:#D3CABA; --wall:#4A4238; --wall3d:#B3A896; --room:#FAF7F1;
  --shadow:0 1px 2px rgba(43,37,29,.08),0 6px 20px rgba(43,37,29,.07);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#171411; --panel:#211D18; --panel2:#2A251F; --ink:#EDE6DA; --muted:#9A8F7E;
    --line:#3A332B; --accent:#D9814C; --accent-soft:#43301F; --accent-ink:#1D130B;
    --canvas:#1D1915; --grid:#2B2620; --grid2:#37312A; --wall:#0E0C0A; --wall3d:#57503F; --room:#262119;
    --shadow:0 1px 2px rgba(0,0,0,.4),0 6px 20px rgba(0,0,0,.35);
  }
}
:root[data-theme="dark"]{
  --bg:#171411; --panel:#211D18; --panel2:#2A251F; --ink:#EDE6DA; --muted:#9A8F7E;
  --line:#3A332B; --accent:#D9814C; --accent-soft:#43301F; --accent-ink:#1D130B;
  --canvas:#1D1915; --grid:#2B2620; --grid2:#37312A; --wall:#0E0C0A; --wall3d:#57503F; --room:#262119;
  --shadow:0 1px 2px rgba(0,0,0,.4),0 6px 20px rgba(0,0,0,.35);
}
*{box-sizing:border-box; margin:0}
html,body{height:100%}
body{
  background:var(--bg); color:var(--ink);
  font-family:"Zen Kaku Gothic New","Hiragino Kaku Gothic ProN","Yu Gothic",Meiryo,sans-serif;
  font-size:14px; display:flex; flex-direction:column; overflow:hidden;
  -webkit-tap-highlight-color:transparent;
}
button{font:inherit; color:inherit; background:none; border:0; cursor:pointer}
button:focus-visible,input:focus-visible{outline:2px solid var(--accent); outline-offset:2px}
input{font:inherit; color:inherit}

header{
  display:flex; align-items:center; gap:14px; flex-wrap:wrap;
  padding:10px 16px 8px; border-bottom:1px solid var(--line); background:var(--panel);
}
.wordmark{font-family:"Shippori Mincho",serif; font-weight:700; font-size:17px; letter-spacing:.06em; white-space:nowrap}
.wordmark small{font-family:inherit; font-weight:600; font-size:11px; color:var(--muted); letter-spacing:.18em; margin-left:8px}
.tabs{display:flex; gap:2px; background:var(--panel2); border-radius:9px; padding:3px; overflow-x:auto}
.tabs button{padding:5px 12px; border-radius:7px; white-space:nowrap; color:var(--muted); font-weight:500}
.tabs button[aria-pressed="true"]{background:var(--panel); color:var(--ink); box-shadow:var(--shadow); font-weight:700}
.seg{display:flex; background:var(--panel2); border-radius:9px; padding:3px; margin-left:auto}
.seg button{padding:5px 16px; border-radius:7px; color:var(--muted); font-weight:700; letter-spacing:.06em}
.seg button[aria-pressed="true"]{background:var(--accent); color:var(--accent-ink)}

.toolbar{
  display:flex; align-items:center; gap:10px; flex-wrap:wrap;
  padding:7px 16px; border-bottom:1px solid var(--line); background:var(--panel);
}
.toolbar .dims{display:flex; align-items:center; gap:6px; color:var(--muted); font-size:12px}
.toolbar input[type=number]{
  width:70px; padding:4px 6px; border:1px solid var(--line); border-radius:6px;
  background:var(--panel2); font-variant-numeric:tabular-nums; text-align:right;
}
.toolbar .note{font-size:11px; color:var(--muted)}
.tbtn{padding:5px 11px; border:1px solid var(--line); border-radius:7px; background:var(--panel2); font-weight:500}
.tbtn:hover{border-color:var(--muted)}
.spacer{flex:1}

main{flex:1; display:flex; min-height:0}
aside{
  width:196px; flex-shrink:0; border-right:1px solid var(--line); background:var(--panel);
  overflow-y:auto; padding:10px;
}
aside h2{font-size:11px; letter-spacing:.14em; color:var(--muted); font-weight:700; margin:6px 4px 8px}
.pal{width:100%; display:flex; align-items:center; gap:9px; padding:7px 8px; border-radius:8px; text-align:left; margin-bottom:2px}
.pal:hover{background:var(--panel2)}
.pal .sw{width:26px; height:20px; border-radius:4px; flex-shrink:0; border:1px solid rgba(0,0,0,.18)}
.pal .nm{font-weight:500; line-height:1.25}
.pal .sz{font-size:10.5px; color:var(--muted); font-variant-numeric:tabular-nums}

.stage{flex:1; position:relative; min-width:0; background:var(--canvas)}
canvas{position:absolute; inset:0; width:100%; height:100%; touch-action:none; display:block}
.hint3d{
  position:absolute; top:10px; left:12px; font-size:11px; color:var(--muted);
  background:var(--panel); border:1px solid var(--line); border-radius:7px; padding:4px 10px; pointer-events:none;
}
.selbar{
  position:absolute; left:50%; bottom:14px; transform:translateX(-50%);
  display:none; align-items:center; gap:6px;
  background:var(--panel); border:1px solid var(--line); border-radius:11px; padding:6px 8px; box-shadow:var(--shadow);
}
.selbar.show{display:flex}
.selbar .who{font-size:12px; font-weight:700; padding:0 6px; white-space:nowrap}
.selbar .who small{color:var(--muted); font-weight:500; font-variant-numeric:tabular-nums; margin-left:5px}
.selbar button{padding:5px 10px; border-radius:7px; background:var(--panel2); font-weight:500; white-space:nowrap}
.selbar button.del{color:var(--accent)}
.selbar button:hover{background:var(--accent-soft)}

footer{
  display:flex; align-items:center; gap:14px; flex-wrap:wrap;
  padding:6px 16px; border-top:1px solid var(--line); background:var(--panel);
  font-size:12px; color:var(--muted); font-variant-numeric:tabular-nums;
}
footer .now{color:var(--ink); font-weight:700}
footer .chip{white-space:nowrap}
footer .chip b{color:var(--ink); font-weight:700}

dialog{
  border:1px solid var(--line); border-radius:14px; background:var(--panel); color:var(--ink);
  padding:18px; width:min(560px, 92vw); box-shadow:var(--shadow);
}
dialog::backdrop{background:rgba(20,16,12,.45)}
dialog h3{font-size:15px; margin-bottom:4px}
dialog p{font-size:12px; color:var(--muted); margin-bottom:10px}
dialog textarea{
  width:100%; height:180px; border:1px solid var(--line); border-radius:8px; background:var(--panel2);
  color:var(--ink); font:11px/1.5 ui-monospace,Consolas,monospace; padding:8px; resize:vertical;
}
dialog .row{display:flex; gap:8px; justify-content:flex-end; margin-top:12px}
dialog .row .primary{background:var(--accent); color:var(--accent-ink); border-color:var(--accent)}

@media (max-width:760px){
  main{flex-direction:column}
  aside{width:100%; border-right:0; border-bottom:1px solid var(--line); overflow-x:auto; overflow-y:hidden;
    display:flex; gap:4px; padding:8px; align-items:stretch}
  aside h2{display:none}
  .pal{flex-direction:column; gap:4px; width:auto; min-width:86px; text-align:center; padding:6px}
  .pal .sz{display:none}
  .wordmark small{display:none}
}
</style>
</head>
<body>

<header>
  <div class="wordmark">わびのや配置スタジオ<small>焼肉 和火焼 わびのや</small></div>
  <nav class="tabs" id="tabs" aria-label="フロア"></nav>
  <div class="seg" role="group" aria-label="表示切替">
    <button id="v2d" aria-pressed="true">2D</button>
    <button id="v3d" aria-pressed="false">3D</button>
  </div>
</header>

<div class="toolbar">
  <div class="seg" role="group" aria-label="編集対象" style="margin-left:0">
    <button id="mFurn" aria-pressed="true">家具</button>
    <button id="mPlan" aria-pressed="false">間取り</button>
  </div>
  <button class="tbtn" id="addWallH" hidden>＋壁(横)</button>
  <button class="tbtn" id="addWallV" hidden>＋壁(縦)</button>
  <span class="dims">
    間口 <input type="number" id="roomW" step="50" min="1500" max="30000"> ×
    奥行 <input type="number" id="roomD" step="50" min="1500" max="30000"> mm
  </span>
  <span class="note">※1〜3Fは白図(2025-07-03)から全室を概略再現（図面固定）。テラスは指定寸法6200×3800・編集可</span>
  <span class="spacer"></span>
  <button class="tbtn" id="undoBtn" title="Ctrl+Z">元に戻す</button>
  <button class="tbtn" id="resetBtn">このフロアを初期配置に戻す</button>
  <button class="tbtn" id="ioBtn">書き出し / 読み込み</button>
</div>

<main>
  <aside id="palette"><h2>家具を追加</h2></aside>
  <div class="stage" id="stage">
    <canvas id="cv"></canvas>
    <div class="hint3d" id="hint" hidden>ドラッグで回転 / ホイール・ピンチで拡大縮小</div>
    <div class="selbar" id="selbar">
      <span class="who" id="selName"></span>
      <button id="rotBtn">回転 45°</button>
      <button id="rot90Btn" hidden>回転 90°</button>
      <button id="dupBtn">複製</button>
      <button id="delBtn" class="del">削除</button>
    </div>
  </div>
</main>

<footer id="foot"></footer>

<dialog id="ioDlg">
  <h3>レイアウトの書き出し / 読み込み</h3>
  <p>下のテキストを保存しておけば、別の端末や共有相手の画面で「読み込み」から復元できる。</p>
  <textarea id="ioText" spellcheck="false"></textarea>
  <div class="row">
    <button class="tbtn" id="ioCopy">コピー</button>
    <button class="tbtn primary" id="ioLoad">この内容を読み込む</button>
    <button class="tbtn" id="ioClose">閉じる</button>
  </div>
</dialog>

const LS_KEY='wabinoya-layout-v3';
let state={floors:defaultFloors()};
try{
  const raw=localStorage.getItem(LS_KEY);
  if(raw){ const p=JSON.parse(raw);
    if(p&&p.floors){ FLOOR_NAMES.forEach(n=>{ if(p.floors[n]) state.floors[n]=p.floors[n]; }); } }
  /* マイグレーション: 既定間取りが更新されたフロアだけ間取りを差し替え（家具配置は引き継ぐ）。
     ユーザーが間取り編集モードで直した内容は pv が一致する限り保持される */
  {
    const defs=defaultFloors();
    FLOOR_NAMES.forEach(n=>{
      const dv=defs[n]; if(!dv.walls)return;
      const sv=state.floors[n]||dv;
      if(sv.pv===dv.pv && sv.walls){ state.floors[n]=sv; return; }
      let items=sv.items||dv.items;
      if(n==='1F' && sv.w===7700) items=items.map(i=>({uid:i.uid,cat:i.cat,x:i.x+2713,y:i.y,rot:i.rot||0}));
      state.floors[n]=Object.assign({},dv,{items});
    });
    /* 旧テラス(5400×3600)の保存データは新仕様(6200×3800・対面配置)へ置き換え */
    const tr=state.floors['テラス'];
    if(tr && tr.w===5400 && tr.d===3600) state.floors['テラス']=defs['テラス'];
  }
}catch(e){}

/* 間取り選択ヘルパー */
function planArr(){ if(!selPlan)return null;
  const f=fl();
  return selPlan.t==='wall'?f.walls:selPlan.t==='zone'?f.zones:f.rooms; }
function planRect(){ const a=planArr(); return a&&a[selPlan.i]||null; }
function planHandlePts(r){
  const [x0,y0]=toPx(r.x,r.y), [x1,y1]=toPx(r.x+r.w,r.y+r.h);
  return [
    {edge:'w',x:x0,y:(y0+y1)/2},{edge:'e',x:x1,y:(y0+y1)/2},
    {edge:'n',x:(x0+x1)/2,y:y0},{edge:'s',x:(x0+x1)/2,y:y1},
  ];
}
function planDown(px,py){
  const [mx,my]=toMm(px,py), f=fl();
  const curR=planRect();
  if(curR){
    for(const p of planHandlePts(curR)){
      if(Math.abs(px-p.x)<10&&Math.abs(py-p.y)<10){
        pushUndo(); drag={type:'presize',edge:p.edge,moved:false}; return;
      }
    }
  }
  function inRect(r,m){ return mx>=r.x-m&&mx<=r.x+r.w+m&&my>=r.y-m&&my<=r.y+r.h+m; }
  let found=null;
  const ws=f.walls||[], wm=12/view2d.scale;
  for(let i=ws.length-1;i>=0;i--){ if(inRect(ws[i],wm)){found={t:'wall',i};break} }
  if(!found){ const zs=f.zones||[];
    for(let i=zs.length-1;i>=0;i--){ if(inRect(zs[i],0)){found={t:'zone',i};break} } }
  if(!found){ const rs=f.rooms||[];
    for(let i=rs.length-1;i>=0;i--){ const r=rs[i]; const [lx,ly]=toPx(r.x,r.y);
      if(px>=lx&&px<=lx+150&&py>=ly&&py<=ly+38){found={t:'room',i};break} } }
  selPlan=found;
  if(found){ const rr=planRect();
    drag={type:'pmove', offX:rr.x-mx, offY:rr.y-my, moved:false, undoDone:false}; }
  else drag=null;
  syncSelbar(); render();
}

/* ================= フッター（席数） ================= */
function seatsOf(f){
  let seats=0,tables=0,chairs=0;
  f.items.forEach(i=>{ const c=CAT[i.cat];
    if(c.kind==='chair'){seats++;chairs++;}
    else if(c.kind==='stool'){const n=Math.max(1,Math.round(c.w/600)); seats+=n; chairs+=n;}
    else if(c.kind==='bench'){seats+=Math.round(c.w/600);}
    else if(c.kind==='table'||c.kind==='roaster'){tables++;} });
  return {seats,tables,chairs};
}
function renderFoot(){
  const foot=document.getElementById('foot');
  let total=0, parts=FLOOR_NAMES.map(n=>{
    const s=seatsOf(state.floors[n]); total+=s.seats;
    return '<span class="chip'+(n===cur?' now':'')+'">'+n+' <b>'+s.seats+'席</b></span>';
  });
  const s=seatsOf(fl());
  foot.innerHTML='<span class="now">'+cur+'：卓'+s.tables+'・椅子'+s.chairs+'・計'+s.seats+'席</span>'
    +parts.join('')+'<span class="chip">全館 <b>'+total+'席</b></span>';
}

/* ================= キャンバス共通 ================= */
const stage=document.getElementById('stage'), cv=document.getElementById('cv'), ctx=cv.getContext('2d');
let CW=0,CH=0,DPR=1;
function resize(){
  DPR=Math.min(2,window.devicePixelRatio||1);
  CW=stage.clientWidth; CH=stage.clientHeight;
  cv.width=Math.round(CW*DPR); cv.height=Math.round(CH*DPR);
  ctx.setTransform(DPR,0,0,DPR,0,0); render();
}
new ResizeObserver(resize).observe(stage);
function cssVar(n){ return getComputedStyle(document.documentElement).getPropertyValue(n).trim(); }

/* 回転AABB半径とクランプ */
function halfExt(it){ const c=CAT[it.cat], a=it.rot*Math.PI/180;
  return { hx:(Math.abs(Math.cos(a))*c.w+Math.abs(Math.sin(a))*c.d)/2,
           hy:(Math.abs(Math.sin(a))*c.w+Math.abs(Math.cos(a))*c.d)/2 }; }
function clampItem(it){ const f=fl(), h=halfExt(it);
  it.x=Math.min(f.w-h.hx, Math.max(h.hx, it.x));
  it.y=Math.min(f.d-h.hy, Math.max(h.hy, it.y)); }

/* ================= 2D描画 ================= */
let view2d={scale:1,ox:0,oy:0};
function calc2d(){ const f=fl(), pad=52;
  view2d.scale=Math.min((CW-pad*2)/f.w,(CH-pad*2)/f.d);
  view2d.ox=(CW-f.w*view2d.scale)/2; view2d.oy=(CH-f.d*view2d.scale)/2; }
function toPx(x,y){ return [view2d.ox+x*view2d.scale, view2d.oy+y*view2d.scale]; }
function toMm(px,py){ return [(px-view2d.ox)/view2d.scale,(py-view2d.oy)/view2d.scale]; }

function draw2d(){
  calc2d();
  const f=fl(), s=view2d.scale;
  if(!(s>0)||!isFinite(s))return;
  ctx.clearRect(0,0,CW,CH);
  ctx.fillStyle=cssVar('--canvas'); ctx.fillRect(0,0,CW,CH);
  const [x0,y0]=toPx(0,0), [x1,y1]=toPx(f.w,f.d);
  /* 部屋 */
  ctx.fillStyle=cssVar('--room'); ctx.fillRect(x0,y0,x1-x0,y1-y0);
  /* グリッド 500mm */
  ctx.lineWidth=1;
  for(let gx=500; gx<f.w; gx+=500){ const [px]=toPx(gx,0);
    ctx.strokeStyle=(gx%1000===0)?cssVar('--grid2'):cssVar('--grid');
    ctx.beginPath(); ctx.moveTo(px,y0); ctx.lineTo(px,y1); ctx.stroke(); }
  for(let gy=500; gy<f.d; gy+=500){ const [,py]=toPx(0,gy);
    ctx.strokeStyle=(gy%1000===0)?cssVar('--grid2'):cssVar('--grid');
    ctx.beginPath(); ctx.moveTo(x0,py); ctx.lineTo(x1,py); ctx.stroke(); }
  /* 壁・間取り */
  if(f.walls){ drawPlan2d(f); }
  else{ ctx.strokeStyle=cssVar('--wall'); ctx.lineWidth=Math.max(3,100*s);
    ctx.strokeRect(x0,y0,x1-x0,y1-y0); }
  /* 寸法表記 */
  ctx.fillStyle=cssVar('--muted'); ctx.font='11px "Zen Kaku Gothic New",sans-serif';
  ctx.textAlign='center'; ctx.textBaseline='bottom';
  ctx.fillText(f.w.toLocaleString()+' mm',(x0+x1)/2, y0-8);
  ctx.save(); ctx.translate(x0-8,(y0+y1)/2); ctx.rotate(-Math.PI/2);
  ctx.textBaseline='bottom'; ctx.fillText(f.d.toLocaleString()+' mm',0,0); ctx.restore();
  /* 家具 */
  if(editMode==='plan')ctx.globalAlpha=0.35;
  f.items.forEach(it=>drawItem2d(it, it.uid===selUid));
  ctx.globalAlpha=1;
  /* 間取り選択ハイライト */
  if(editMode==='plan')drawPlanSel();
  /* 選択寸法 */
  const sel=selItem();
  if(sel){ const c=CAT[sel.cat], h=halfExt(sel), [px,py]=toPx(sel.x, sel.y-h.hy);
    ctx.fillStyle=cssVar('--accent'); ctx.font='bold 11px "Zen Kaku Gothic New",sans-serif';
    ctx.textAlign='center'; ctx.textBaseline='bottom';
    ctx.fillText(c.w+'×'+c.d, px, py-5); }
}
function drawPlan2d(f){
  const s=view2d.scale;
  function R(r){ const [px,py]=toPx(r.x,r.y); return [px,py,r.w*s,r.h*s]; }
  /* 建物外の欠き込みをキャンバス色でマスク */
  (f.voids||[]).forEach(v=>{ const [px,py,w,h]=R(v);
    ctx.fillStyle=cssVar('--canvas'); ctx.fillRect(px-1,py-1,w+1,h+1); });
  /* ゾーン（壁より先に下地） */
  (f.zones||[]).forEach(z=>{
    const [px,py,w,h]=R(z);
    if(z.kind==='ev'){
      ctx.fillStyle=cssVar('--panel2'); ctx.fillRect(px,py,w,h);
      ctx.strokeStyle=cssVar('--grid2'); ctx.lineWidth=1;
      ctx.beginPath(); ctx.moveTo(px,py); ctx.lineTo(px+w,py+h);
      ctx.moveTo(px+w,py); ctx.lineTo(px,py+h); ctx.stroke();
      ctx.strokeRect(px,py,w,h);
    }else if(z.kind==='stairs'){
      ctx.fillStyle=cssVar('--panel2'); ctx.fillRect(px,py,w,h);
      ctx.strokeStyle=cssVar('--grid2'); ctx.lineWidth=1;
      const rot=z.rot||0, step=Math.max(6,260*s);
      if(rot%180===0){
        const n=Math.floor(w/step);
        for(let i=1;i<n;i++){ ctx.beginPath(); ctx.moveTo(px+i*step,py); ctx.lineTo(px+i*step,py+h); ctx.stroke(); }
      }else{
        const n=Math.floor(h/step);
        for(let i=1;i<n;i++){ ctx.beginPath(); ctx.moveTo(px,py+i*step); ctx.lineTo(px+w,py+i*step); ctx.stroke(); }
      }
      ctx.strokeRect(px,py,w,h);
      /* 上り方向の矢印 */
      if(Math.min(w,h)>14){
        const cx2=px+w/2, cy2=py+h/2, L=Math.min(w,h)*0.32;
        const dir=rot===0?[1,0]:rot===90?[0,1]:rot===180?[-1,0]:[0,-1];
        const ax=cx2+dir[0]*L, ay=cy2+dir[1]*L, bx=cx2-dir[0]*L, by=cy2-dir[1]*L;
        ctx.strokeStyle=cssVar('--muted'); ctx.lineWidth=1.5;
        ctx.beginPath(); ctx.moveTo(bx,by); ctx.lineTo(ax,ay);
        ctx.moveTo(ax-dir[0]*6-dir[1]*5, ay-dir[1]*6-dir[0]*5);
        ctx.lineTo(ax,ay);
        ctx.lineTo(ax-dir[0]*6+dir[1]*5, ay-dir[1]*6+dir[0]*5);
        ctx.stroke();
      }
    }else if(z.kind==='wc'){
      ctx.fillStyle=cssVar('--room'); ctx.fillRect(px,py,w,h);
      ctx.strokeStyle=cssVar('--grid2'); ctx.strokeRect(px,py,w,h);
      ctx.fillStyle=cssVar('--grid2');
      ctx.beginPath(); ctx.ellipse(px+w/2,py+h/2,Math.min(w,h)*.18,Math.min(w,h)*.26,0,0,7); ctx.fill();
    }else{ /* ps / shelf */
      ctx.fillStyle=cssVar('--grid'); ctx.fillRect(px,py,w,h);
      ctx.strokeStyle=cssVar('--grid2'); ctx.strokeRect(px,py,w,h);
    }
    if(z.label && w>18){
      ctx.fillStyle=cssVar('--muted'); ctx.font='10px "Zen Kaku Gothic New",sans-serif';
      ctx.textAlign='center'; ctx.textBaseline='middle';
      ctx.fillText(z.label, px+w/2, py+h/2+(z.kind==='wc'?h*.36:0));
    }
  });
  /* 壁 */
  ctx.fillStyle=cssVar('--wall');
  f.walls.forEach(wr=>{ const [px,py,w,h]=R(wr); ctx.fillRect(px,py,w,h); });
  /* 部屋ラベル＋内寸表示 */
  (f.rooms||[]).forEach(r=>{
    const [px,py,w,h]=R(r);
    if(w<50)return;
    ctx.fillStyle=cssVar('--muted'); ctx.font='11px "Zen Kaku Gothic New",sans-serif';
    ctx.textAlign='left'; ctx.textBaseline='top';
    ctx.fillText(r.label, px+8, py+6);
    if(h>34){
      ctx.font='10px "Zen Kaku Gothic New",sans-serif';
      ctx.fillText(r.w.toLocaleString()+'×'+r.h.toLocaleString(), px+8, py+20);
    }
  });
}
function drawPlanSel(){
  const r=planRect(); if(!r)return;
  const s=view2d.scale, [px,py]=toPx(r.x,r.y), w=r.w*s, h=r.h*s;
  ctx.strokeStyle=cssVar('--accent'); ctx.lineWidth=2; ctx.setLineDash([6,4]);
  ctx.strokeRect(px-2,py-2,w+4,h+4); ctx.setLineDash([]);
  ctx.fillStyle=cssVar('--accent');
  planHandlePts(r).forEach(p=>{ ctx.fillRect(p.x-5,p.y-5,10,10); });
  ctx.font='bold 11px "Zen Kaku Gothic New",sans-serif';
  ctx.textAlign='center'; ctx.textBaseline='bottom';
  ctx.fillText(r.w.toLocaleString()+'×'+r.h.toLocaleString(), px+w/2, py-8);
}
function drawItem2d(it, sel){
  const c=CAT[it.cat], s=view2d.scale, [px,py]=toPx(it.x,it.y);
  ctx.save(); ctx.translate(px,py); ctx.rotate(it.rot*Math.PI/180);
  const w=c.w*s, d=c.d*s;
  ctx.fillStyle=c.color; ctx.strokeStyle='rgba(0,0,0,.28)'; ctx.lineWidth=1;
  rr(-w/2,-d/2,w,d,Math.min(5,w*.08)); ctx.fill(); ctx.stroke();
  if(c.kind==='chair'){ /* 背もたれ */
    ctx.fillStyle='rgba(0,0,0,.30)'; rr(-w/2,-d/2,w,Math.max(2,d*.16),2); ctx.fill(); }
  if(c.kind==='bench'){ ctx.fillStyle='rgba(0,0,0,.25)'; rr(-w/2,-d/2,w,Math.max(2,d*.25),2); ctx.fill(); }
  if(c.kind==='roaster'){ ctx.fillStyle='#2A2320';
    const r=Math.min(w,d)*.30; ctx.beginPath(); ctx.arc(0,0,r,0,7); ctx.fill();
    ctx.strokeStyle='rgba(255,255,255,.25)'; ctx.beginPath(); ctx.arc(0,0,r*.6,0,7); ctx.stroke(); }
  if(c.kind==='table'){ ctx.strokeStyle='rgba(0,0,0,.15)';
    ctx.beginPath(); ctx.moveTo(-w/2+3,0); ctx.lineTo(w/2-3,0); ctx.moveTo(0,-d/2+3); ctx.lineTo(0,d/2-3); ctx.stroke(); }
  if(c.kind==='plant'){ ctx.fillStyle='rgba(255,255,255,.25)';
    ctx.beginPath(); ctx.arc(0,0,Math.min(w,d)*.22,0,7); ctx.fill(); }
  if(c.kind==='counter'&&w>46){ ctx.fillStyle='rgba(255,255,255,.75)';
    ctx.font='10px "Zen Kaku Gothic New",sans-serif'; ctx.textAlign='center'; ctx.textBaseline='middle';
    ctx.fillText('レジ',0,0); }
  if(sel){ ctx.strokeStyle=cssVar('--accent'); ctx.lineWidth=2; ctx.setLineDash([5,3]);
    rr(-w/2-3,-d/2-3,w+6,d+6,5); ctx.stroke(); ctx.setLineDash([]); }
  ctx.restore();
}
function rr(x,y,w,h,r){ r=Math.min(r,w/2,h/2);
  ctx.beginPath(); ctx.moveTo(x+r,y);
  ctx.arcTo(x+w,y,x+w,y+h,r); ctx.arcTo(x+w,y+h,x,y+h,r);
  ctx.arcTo(x,y+h,x,y,r); ctx.arcTo(x,y,x+w,y,r); ctx.closePath(); }

/* ================= 3D描画 ================= */
const cam={yaw:1.05, pitch:0.82, dist:0}; /* 初期視点＝平面図の手前(下辺)側から */
function camDist(){ const f=fl(); return cam.dist>0?cam.dist:Math.max(f.w,f.d)*1.75; }
function draw3d(){
  const f=fl();
  ctx.clearRect(0,0,CW,CH);
  ctx.fillStyle=cssVar('--canvas'); ctx.fillRect(0,0,CW,CH);
  const tgt=[f.w/2, f.d/2, 350], D=camDist();
  const eye=[ tgt[0]+D*Math.cos(cam.pitch)*Math.cos(cam.yaw),
              tgt[1]+D*Math.cos(cam.pitch)*Math.sin(cam.yaw),
              tgt[2]+D*Math.sin(cam.pitch) ];
  const fwd=norm(sub(tgt,eye)), rgt=norm(cross(fwd,[0,0,1])), up=cross(rgt,fwd);
  const fovLen=Math.min(CW,CH)*1.25;
  function proj(p){ const v=sub(p,eye);
    const dz=dot(v,fwd); if(dz<10)return null;
    /* 平面座標がy下向きのため、スクリーンXを反転して鏡像を解消する */
    return {x:CW/2-fovLen*dot(v,rgt)/dz, y:CH/2-fovLen*dot(v,up)/dz, z:dz}; }
  function quad(pts,color,stroke){
    const q=pts.map(proj); if(q.some(p=>!p))return null;
    return {q,z:(q[0].z+q[1].z+q[2].z+q[3].z)/4,color,stroke}; }
  function fillQ(o){ ctx.beginPath(); ctx.moveTo(o.q[0].x,o.q[0].y);
    for(let i=1;i<4;i++)ctx.lineTo(o.q[i].x,o.q[i].y); ctx.closePath();
    ctx.fillStyle=o.color; ctx.fill();
    ctx.strokeStyle=o.stroke||'rgba(0,0,0,.12)'; ctx.lineWidth=.7; ctx.stroke(); }

  /* 床＋グリッド */
  const fq=quad([[0,0,0],[f.w,0,0],[f.w,f.d,0],[0,f.d,0]], cssVar('--room'));
  if(fq)fillQ(fq);
  ctx.strokeStyle=cssVar('--grid'); ctx.lineWidth=.6;
  for(let gx=0; gx<=f.w; gx+=500){ const a=proj([gx,0,1]), b=proj([gx,f.d,1]);
    if(a&&b){ctx.beginPath();ctx.moveTo(a.x,a.y);ctx.lineTo(b.x,b.y);ctx.stroke();} }
  for(let gy=0; gy<=f.d; gy+=500){ const a=proj([0,gy,1]), b=proj([f.w,gy,1]);
    if(a&&b){ctx.beginPath();ctx.moveTo(a.x,a.y);ctx.lineTo(b.x,b.y);ctx.stroke();} }

  /* 建物外の欠き込みをキャンバス色でマスク */
  (f.voids||[]).forEach(v=>{
    const o=quad([[v.x,v.y,2],[v.x+v.w,v.y,2],[v.x+v.w,v.y+v.h,2],[v.x,v.y+v.h,2]], cssVar('--canvas'), 'rgba(0,0,0,0)');
    if(o)fillQ(o);
  });
  /* 壁（図面フロア＝腰高1150のドールハウス表示／テラス＝奥側フェンスのみ） */
  const light=norm([0.45,0.3,0.85]);
  const faces=[];
  function pushBox(cx,cy,b,color,stroke){
    const pit={x:cx,y:cy,rot:0};
    boxFaces(pit,b).forEach(fc=>{
      if(dot(fc.n, sub(eye,fc.c))<=0)return;
      const sh=0.6+0.4*Math.max(0,dot(fc.n,light));
      const o=quad(fc.pts, shade(color,sh), stroke||null);
      if(o)faces.push(o);
    });
  }
  if(f.walls){
    const wallC3=cssVar('--wall3d');
    f.walls.forEach(wr=>pushBox(wr.x+wr.w/2, wr.y+wr.h/2, {x:0,y:0,z:0,w:wr.w,d:wr.h,h:1150}, wallC3));
    (f.zones||[]).forEach(z=>{
      const cx=z.x+z.w/2, cy=z.y+z.h/2;
      if(z.kind==='ev') pushBox(cx,cy,{x:0,y:0,z:0,w:z.w,d:z.h,h:2300},'#8E857A');
      else if(z.kind==='stairs'){
        const n=6, rot=z.rot||0;
        if(rot%180===0){
          const sw=z.w/n;
          for(let i=0;i<n;i++){ const k=(rot===0? i+1 : n-i);
            pushBox(z.x+sw*(i+.5),cy,{x:0,y:0,z:0,w:sw,d:z.h,h:180*k},'#8E857A'); }
        }else{
          const sd=z.h/n;
          for(let i=0;i<n;i++){ const k=(rot===90? i+1 : n-i);
            pushBox(cx,z.y+sd*(i+.5),{x:0,y:0,z:0,w:z.w,d:sd,h:180*k},'#8E857A'); }
        }
      }
      else if(z.kind==='wc') pushBox(cx, z.y+450, {x:0,y:0,z:0,w:450,d:700,h:420},'#D8D2C8');
      else if(z.kind==='ps') pushBox(cx,cy,{x:0,y:0,z:0,w:z.w,d:z.h,h:1100},'#8E857A');
      else if(z.kind==='shelf') pushBox(cx,cy,{x:0,y:0,z:0,w:z.w,d:z.h,h:900},'#8E857A');
    });
  }else{
    const WH=900, wallC=cssVar('--panel2');
    const twalls=[
      {n:[0,-1,0], pts:[[0,0,0],[f.w,0,0],[f.w,0,WH],[0,0,WH]], c:[f.w/2,0,WH/2]},
      {n:[0,1,0],  pts:[[f.w,f.d,0],[0,f.d,0],[0,f.d,WH],[f.w,f.d,WH]], c:[f.w/2,f.d,WH/2]},
      {n:[-1,0,0], pts:[[0,f.d,0],[0,0,0],[0,0,WH],[0,f.d,WH]], c:[0,f.d/2,WH/2]},
      {n:[1,0,0],  pts:[[f.w,0,0],[f.w,f.d,0],[f.w,f.d,WH],[f.w,0,WH]], c:[f.w,f.d/2,WH/2]},
    ];
    twalls.forEach(w=>{ if(dot(w.n, sub(eye,w.c))<0){ const o=quad(w.pts, wallC,'rgba(0,0,0,.18)'); if(o)fillQ(o); } });
  }

  /* 接地影 */
  f.items.forEach(it=>{ const c=CAT[it.cat], pts=footprint(it,c,90).map(p=>[p[0],p[1],2]);
    const o=quad(pts,'rgba(0,0,0,0)'); if(!o)return;
    ctx.beginPath(); ctx.moveTo(o.q[0].x,o.q[0].y);
    for(let i=1;i<4;i++)ctx.lineTo(o.q[i].x,o.q[i].y); ctx.closePath();
    ctx.fillStyle='rgba(20,14,8,.13)'; ctx.fill(); });

  /* 家具の面を収集して奥から描画 */
  f.items.forEach(it=>{
    const c=CAT[it.cat], sel=(it.uid===selUid);
    model3d(c).forEach(b=>{
      const col=b.color||c.color;
      boxFaces(it,b).forEach(fc=>{
        if(dot(fc.n, sub(eye,fc.c))<=0)return;
        const sh=0.58+0.42*Math.max(0,dot(fc.n,light));
        const o=quad(fc.pts, shade(col,sh), sel?cssVar('--accent'):null);
        if(o){ if(sel)o.selW=1.6; faces.push(o); }
      });
    });
  });
  faces.sort((a,b)=>b.z-a.z);
  faces.forEach(o=>{ ctx.beginPath(); ctx.moveTo(o.q[0].x,o.q[0].y);
    for(let i=1;i<4;i++)ctx.lineTo(o.q[i].x,o.q[i].y); ctx.closePath();
    ctx.fillStyle=o.color; ctx.fill();
    ctx.strokeStyle=o.stroke||'rgba(0,0,0,.14)'; ctx.lineWidth=o.selW||.7; ctx.stroke(); });

  /* フロア名 */
  ctx.fillStyle=cssVar('--muted'); ctx.font='12px "Zen Kaku Gothic New",sans-serif';
  ctx.textAlign='left'; ctx.textBaseline='alphabetic';
  ctx.fillText(cur+'　'+f.w.toLocaleString()+'×'+f.d.toLocaleString()+' mm', 14, CH-14);
}
/* 家具の3Dモデル（ローカル座標の箱の集合） */
function model3d(c){
  const w=c.w,d=c.d;
  switch(c.kind){
    case 'table': return [
      {x:0,y:0,z:650,w:w,d:d,h:55},
      {x:0,y:0,z:30,w:80,d:80,h:620,color:'#4C3A28'},
      {x:0,y:0,z:0,w:Math.min(w*.7,420),d:Math.min(d*.7,420),h:30,color:'#4C3A28'} ];
    case 'roaster': return [
      {x:0,y:0,z:640,w:w,d:d,h:80},
      {x:0,y:0,z:720,w:Math.min(w,d)*.5,d:Math.min(w,d)*.5,h:10,color:'#211B17'},
      {x:0,y:0,z:0,w:w*.55,d:d*.55,h:640,color:'#3E2F22'} ];
    case 'chair': return [
      {x:0,y:0,z:400,w:w,d:d,h:50},
      {x:-w/2+25,y:-d/2+25,z:0,w:44,d:44,h:400,color:'#4C3A28'},
      {x:w/2-25,y:-d/2+25,z:0,w:44,d:44,h:400,color:'#4C3A28'},
      {x:-w/2+25,y:d/2-25,z:0,w:44,d:44,h:400,color:'#4C3A28'},
      {x:w/2-25,y:d/2-25,z:0,w:44,d:44,h:400,color:'#4C3A28'},
      {x:0,y:-d/2+30,z:450,w:w,d:55,h:330} ];
    case 'bench': return [
      {x:0,y:-d/2+100,z:0,w:w,d:200,h:820},
      {x:0,y:-d/2+475,z:0,w:w,d:550,h:440} ];
    case 'stool': return [
      {x:0,y:0,z:400,w:w,d:d,h:45},
      {x:-w/2+25,y:-d/2+25,z:0,w:44,d:44,h:400,color:'#4C3A28'},
      {x:w/2-25,y:-d/2+25,z:0,w:44,d:44,h:400,color:'#4C3A28'},
      {x:-w/2+25,y:d/2-25,z:0,w:44,d:44,h:400,color:'#4C3A28'},
      {x:w/2-25,y:d/2-25,z:0,w:44,d:44,h:400,color:'#4C3A28'} ];
    case 'counter': { const H=c.hgt||950; return [
      {x:0,y:0,z:0,w:w,d:d,h:H-50},
      {x:0,y:0,z:H-50,w:w+70,d:d+70,h:50,color:'#3E2F22'} ]; }
    case 'plant': return [
      {x:0,y:0,z:0,w:300,d:300,h:340,color:POT},
      {x:0,y:0,z:340,w:w,d:d,h:900} ];
    default: return [{x:0,y:0,z:0,w:w,d:d,h:700}];
  }
}
function boxFaces(it,b){
  const a=it.rot*Math.PI/180, ca=Math.cos(a), sa=Math.sin(a);
  function W(lx,ly,z){ return [ it.x+lx*ca-ly*sa, it.y+lx*sa+ly*ca, z ]; }
  const x0=b.x-b.w/2, x1=b.x+b.w/2, y0=b.y-b.d/2, y1=b.y+b.d/2, z0=b.z, z1=b.z+b.h;
  function rn(nx,ny,nz){ return norm([nx*ca-ny*sa, nx*sa+ny*ca, nz]); }
  return [
    {pts:[W(x0,y0,z1),W(x1,y0,z1),W(x1,y1,z1),W(x0,y1,z1)], n:[0,0,1], c:W(b.x,b.y,z1)},
    {pts:[W(x0,y0,z0),W(x1,y0,z0),W(x1,y0,z1),W(x0,y0,z1)], n:rn(0,-1,0), c:W(b.x,y0,(z0+z1)/2)},
    {pts:[W(x1,y1,z0),W(x0,y1,z0),W(x0,y1,z1),W(x1,y1,z1)], n:rn(0,1,0), c:W(b.x,y1,(z0+z1)/2)},
    {pts:[W(x0,y1,z0),W(x0,y0,z0),W(x0,y0,z1),W(x0,y1,z1)], n:rn(-1,0,0), c:W(x0,b.y,(z0+z1)/2)},
    {pts:[W(x1,y0,z0),W(x1,y1,z0),W(x1,y1,z1),W(x1,y0,z1)], n:rn(1,0,0), c:W(x1,b.y,(z0+z1)/2)},
  ];
}
function footprint(it,c,inset){
  const a=it.rot*Math.PI/180, ca=Math.cos(a), sa=Math.sin(a);
  const hw=c.w/2-inset*0, hd=c.d/2;
  const pts=[[-c.w/2,-c.d/2],[c.w/2,-c.d/2],[c.w/2,c.d/2],[-c.w/2,c.d/2]];
  return pts.map(p=>[ it.x+p[0]*ca-p[1]*sa, it.y+p[0]*sa+p[1]*ca ]);
}
function sub(a,b){return [a[0]-b[0],a[1]-b[1],a[2]-b[2]];}
function dot(a,b){return a[0]*b[0]+a[1]*b[1]+a[2]*b[2];}
function cross(a,b){return [a[1]*b[2]-a[2]*b[1], a[2]*b[0]-a[0]*b[2], a[0]*b[1]-a[1]*b[0]];}
function norm(v){const l=Math.hypot(v[0],v[1],v[2])||1;return [v[0]/l,v[1]/l,v[2]/l];}
function shade(hex,f){
  const r=parseInt(hex.slice(1,3),16), g=parseInt(hex.slice(3,5),16), b=parseInt(hex.slice(5,7),16);
  return 'rgb('+Math.round(r*f)+','+Math.round(g*f)+','+Math.round(b*f)+')';
}

/* ================= 入力（2Dドラッグ / 3D軌道） ================= */
let drag=null, pinch=null;
cv.addEventListener('pointerdown',e=>{
  cv.setPointerCapture(e.pointerId);
  const r=cv.getBoundingClientRect(), px=e.clientX-r.left, py=e.clientY-r.top;
  if(mode==='3d'){ drag={type:'orbit', px, py}; return; }
  if(editMode==='plan'){ planDown(px,py); return; }
  const [mx,my]=toMm(px,py);
  const items=fl().items;
  /* 1周目=厳密一致、2周目=12px相当の許容（許容を大きくすると隣の椅子を誤選択する） */
  let hit=null;
  for(let pass=0; pass<2 && !hit; pass++){
    const m = pass===0 ? 0 : 12/view2d.scale;
    for(let i=items.length-1;i>=0;i--){
      const it=items[i], c=CAT[it.cat], a=it.rot*Math.PI/180;
      const dx=mx-it.x, dy=my-it.y;
      const lx=dx*Math.cos(-a)-dy*Math.sin(-a), ly=dx*Math.sin(-a)+dy*Math.cos(-a);
      if(Math.abs(lx)<=c.w/2+m && Math.abs(ly)<=c.d/2+m){ hit=it; break; }
    }
  }
  if(hit){
    selUid=hit.uid;
    /* 最前面へ */
    fl().items=fl().items.filter(i=>i!==hit); fl().items.push(hit);
    drag={type:'move', it:hit, offX:hit.x-mx, offY:hit.y-my, moved:false, undoDone:false};
  }else{ selUid=null; drag=null; }
  syncSelbar(); render();
});
cv.addEventListener('pointermove',e=>{
  if(pinch){ handlePinch(e); return; }
  if(!drag)return;
  const r=cv.getBoundingClientRect(), px=e.clientX-r.left, py=e.clientY-r.top;
  if(drag.type==='orbit'){
    cam.yaw+=(px-drag.px)*0.0062;
    cam.pitch=Math.min(1.45,Math.max(0.18, cam.pitch+(py-drag.py)*0.005));
    drag.px=px; drag.py=py; render(); return;
  }
  if(drag.type==='pmove'||drag.type==='presize'){
    const rr=planRect(); if(!rr)return;
    const [mx2,my2]=toMm(px,py), f=fl();
    if(drag.type==='pmove'){
      if(!drag.undoDone){ pushUndo(); drag.undoDone=true; }
      rr.x=Math.round((mx2+drag.offX)/50)*50; rr.y=Math.round((my2+drag.offY)/50)*50;
    }else{
      const sx=Math.round(mx2/50)*50, sy=Math.round(my2/50)*50;
      if(drag.edge==='w'){ const x1=rr.x+rr.w; rr.x=Math.min(x1-50,Math.max(0,sx)); rr.w=x1-rr.x; }
      if(drag.edge==='e'){ rr.w=Math.max(50, Math.min(f.w-rr.x, sx-rr.x)); }
      if(drag.edge==='n'){ const y1=rr.y+rr.h; rr.y=Math.min(y1-50,Math.max(0,sy)); rr.h=y1-rr.y; }
      if(drag.edge==='s'){ rr.h=Math.max(50, Math.min(f.d-rr.y, sy-rr.y)); }
    }
    rr.x=Math.max(0,Math.min(f.w-rr.w,rr.x)); rr.y=Math.max(0,Math.min(f.d-rr.h,rr.y));
    drag.moved=true; syncSelbar(); render(); return;
  }
  const [mx,my]=toMm(px,py);
  if(!drag.undoDone){ pushUndo(); drag.undoDone=true; }
  drag.it.x=Math.round((mx+drag.offX)/50)*50;
  drag.it.y=Math.round((my+drag.offY)/50)*50;
  clampItem(drag.it); drag.moved=true; render();
});
cv.addEventListener('pointerup',e=>{
  if(drag&&(drag.type==='move'||drag.type==='pmove'||drag.type==='presize')&&drag.moved)save();
  drag=null;
});
cv.addEventListener('wheel',e=>{
  if(mode!=='3d')return;
  e.preventDefault();
  const f=fl(), base=Math.max(f.w,f.d);
  cam.dist=Math.min(base*4, Math.max(base*0.55, camDist()*(1+e.deltaY*0.0012)));
  render();
},{passive:false});
/* ピンチ（3D拡縮） */
const touches=new Map();
cv.addEventListener('pointerdown',e=>{ touches.set(e.pointerId,[e.clientX,e.clientY]);
  if(touches.size===2&&mode==='3d'){ drag=null;
    const a=[...touches.values()]; pinch={d0:Math.hypot(a[0][0]-a[1][0],a[0][1]-a[1][1]), dist0:camDist()}; } });
function handlePinch(e){
  touches.set(e.pointerId,[e.clientX,e.clientY]);
  if(touches.size<2){pinch=null;return;}
  const a=[...touches.values()], d=Math.hypot(a[0][0]-a[1][0],a[0][1]-a[1][1]);
  const f=fl(), base=Math.max(f.w,f.d);
  cam.dist=Math.min(base*4, Math.max(base*0.55, pinch.dist0*pinch.d0/Math.max(20,d)));
  render();
}
cv.addEventListener('pointerup',e=>{ touches.delete(e.pointerId); if(touches.size<2)pinch=null; });
cv.addEventListener('pointercancel',e=>{ touches.delete(e.pointerId); pinch=null; drag=null; });

/* ================= 起動 ================= */
function render(){ if(mode==='2d')draw2d(); else draw3d(); }
window.matchMedia('(prefers-color-scheme: dark)').addEventListener('change',render);
syncTabs(); syncRoomInputs(); renderFoot(); resize();
</script>
</body>
