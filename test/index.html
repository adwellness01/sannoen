<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow,noarchive">
<title>山王苑 理解テスト</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Shippori+Mincho+B1:wght@500;600&family=Noto+Sans+JP:wght@400;500;700&display=swap" rel="stylesheet">
<style>html,body{margin:0;background:#f6f4f0;font-family:"Noto Sans JP",sans-serif}#app:empty::before{content:"読み込み中…";display:block;padding:40px 16px;color:#888;font-size:14px}</style>
</head>
<body>
<div id="app"></div>
<script>
/* この index.html は固定の入口。画面本体（page.html）とスクリプトは毎回サーバーから取り直すため、
   公開サーバーのキャッシュで古い画面と新しいスクリプトが混ざることがない。 */
(async function () {
  var t = Date.now();
  try {
    var r = await fetch("page.html?t=" + t, { cache: "no-store" });
    document.getElementById("app").innerHTML = await r.text();
    for (var f of ["questions.js", "app.js"]) {
      await new Promise(function (res, rej) {
        var s = document.createElement("script"); s.src = f + "?t=" + t; s.onload = res; s.onerror = rej; document.body.appendChild(s);
      });
    }
  } catch (e) {
    document.getElementById("app").innerHTML = '<p style="padding:40px 16px;color:#b3261e">読み込みに失敗しました。通信状態を確認して再読み込みしてください。</p>';
  }
})();
</script>
</body>
</html>
